apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: todo-app-deployment
  name: todo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: todo-app-deployment
    spec:
      containers:
        - image: todo-app
          name: todo-app
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - mountPath: /app/files
              name: todo-storage
      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: todo-claim
