apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-deployment
  labels:
    app: todo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: todo-app-deployment
    spec:
      containers:
        - name: todo-app
          image: todo-app
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - mountPath: /app/files
              name: todo-storage
      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: todo-claim
