apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ping-pong-dep
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-dep
  template:
    metadata:
      labels:
        app: ping-pong-dep
    spec:
      containers:
        - image: joyboy67/ping-pong:3.4
          name: ping-pong
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              value: postgres://postgres:mysecretpassword@postgres-svc:5432/pingpongdb
