apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app: ping-pong-dep
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-dep
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: ping-pong-cpu
  template:
    metadata:
      labels:
        app: ping-pong-dep
    spec:
      containers:
        - image: joyboy67/ping-pong:4.1
          name: ping-pong
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: DATABASE_URL
              value: postgres://postgres:mysecretpassword@postgres-svc:5432/pingpongdb
