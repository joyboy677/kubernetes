apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: logoutput
  name: logoutput
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: logoutput
    spec:
      containers:
        - image: joyboy67/log-output:2.1
          name: log-writer
          command: ["node", "writer.js"]
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files

        - image: joyboy67/log-output:2.1
          name: log-reader
          command: ["node", "reader.js"]
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: log-claim
