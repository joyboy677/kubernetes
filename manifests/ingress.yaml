apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  name: shared-ingress
  namespace: exercises
spec:
  rules:
    - http:
        paths:
          - backend:
              service:
                name: logoutput
                port:
                  number: 2345
            path: /
            pathType: Prefix
          - backend:
              service:
                name: ping-pong-svc
                port:
                  number: 3000
            path: /pingpong
            pathType: Prefix
status:
  loadBalancer: {}
