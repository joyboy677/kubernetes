apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-cronjob
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: wikipedia-cronjob
              image: curlimages/curl:8.12.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  URL=$(curl -sI https://en.wikipedia.org/wiki/Special:Random | grep -i "^location:" | cut -d' ' -f2 | tr -d '\r' | sed 's|^//|https://|')
                  curl -X POST http://todo-backend-svc:3000/todos -H "Content-Type: application/json" -d "{\"text\": \"Read $URL\"}"
          restartPolicy: OnFailure
