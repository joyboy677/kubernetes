name: Build and publish Todo environments

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "todo-app/**"
      - "todo-backend/**"
      - ".github/workflows/todo-environments.yaml"

permissions:
  contents: read

jobs:
  release:
    name: Build images and update configuration repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Select release type
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Todo app
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          docker build -t "joyboy67/todo-app:${IMAGE_TAG}" ./todo-app
          docker push "joyboy67/todo-app:${IMAGE_TAG}"

      - name: Build and publish Todo backend
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          docker build -t "joyboy67/todo-backend:${IMAGE_TAG}" ./todo-backend
          docker push "joyboy67/todo-backend:${IMAGE_TAG}"

      - name: Checkout configuration repository
        uses: actions/checkout@v6
        with:
          repository: joyboy677/kubernetes-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update selected environment overlay
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        working-directory: config/overlays/${{ steps.release.outputs.environment }}
        run: |
          kustomize edit set image "joyboy67/todo-app=joyboy67/todo-app:${IMAGE_TAG}"
          kustomize edit set image "joyboy67/todo-backend=joyboy67/todo-backend:${IMAGE_TAG}"

      - name: Commit configuration change
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          ENVIRONMENT: ${{ steps.release.outputs.environment }}
        working-directory: config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "overlays/${ENVIRONMENT}/kustomization.yaml"
          git commit -m "Update ${ENVIRONMENT} images ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main
