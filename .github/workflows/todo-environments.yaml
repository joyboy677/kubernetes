name: Build and publish Todo environments

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "todo-app/**"
      - "todo-backend/**"
      - ".github/workflows/todo-environments.yaml"

permissions:
  contents: write

jobs:
  release:
    name: Build images and update environment config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Select release type
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Todo app
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          docker build -t "joyboy67/todo-app:${IMAGE_TAG}" ./todo-app
          docker push "joyboy67/todo-app:${IMAGE_TAG}"

      - name: Build and publish Todo backend
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          docker build -t "joyboy67/todo-backend:${IMAGE_TAG}" ./todo-backend
          docker push "joyboy67/todo-backend:${IMAGE_TAG}"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update selected overlay
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          ENVIRONMENT: ${{ steps.release.outputs.environment }}
        run: |
          kustomize edit set image "joyboy67/todo-app=joyboy67/todo-app:${IMAGE_TAG}"
          kustomize edit set image "joyboy67/todo-backend=joyboy67/todo-backend:${IMAGE_TAG}"
        working-directory: environments/overlays/${{ steps.release.outputs.environment }}

      - name: Commit staging config to main
        if: steps.release.outputs.environment == 'staging'
        uses: EndBug/add-and-commit@v10
        with:
          add: environments/overlays/staging/kustomization.yaml
          message: "Update staging images ${{ github.sha }} [skip ci]"
          default_author: github_actions

      - name: Commit production config to main
        if: steps.release.outputs.environment == 'production'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git checkout "${GITHUB_SHA}" -- environments/overlays/production/kustomization.yaml
          cd environments/overlays/production
          kustomize edit set image "joyboy67/todo-app=joyboy67/todo-app:${IMAGE_TAG}"
          kustomize edit set image "joyboy67/todo-backend=joyboy67/todo-backend:${IMAGE_TAG}"
          cd ../../..
          git add environments/overlays/production/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update production images ${IMAGE_TAG} [skip ci]"
          git push origin main
