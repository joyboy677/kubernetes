name: Build and publish Todo project

on:
  push:
    branches:
      - main
    paths:
      - "todo-app/**"
      - "todo-backend/**"
      - "kustomization.yaml"
      - ".github/workflows/todo-project-gitops.yaml"

permissions:
  contents: write

jobs:
  build-publish-release:
    name: Build, push, and update GitOps image tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Todo app
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "joyboy67/todo-app:${IMAGE_TAG}" ./todo-app
          docker push "joyboy67/todo-app:${IMAGE_TAG}"

      - name: Build and publish Todo backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "joyboy67/todo-backend:${IMAGE_TAG}" ./todo-backend
          docker push "joyboy67/todo-backend:${IMAGE_TAG}"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags in root manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kustomize edit set image "joyboy67/todo-app=joyboy67/todo-app:${IMAGE_TAG}"
          kustomize edit set image "joyboy67/todo-backend=joyboy67/todo-backend:${IMAGE_TAG}"

      - name: Commit updated manifests
        uses: EndBug/add-and-commit@v10
        with:
          add: kustomization.yaml
          message: "Release Todo project ${{ github.sha }}"
          default_author: github_actions
