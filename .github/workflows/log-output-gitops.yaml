name: Build and publish Log output

on:
  push:
    branches:
      - main
    paths:
      - "log-output/**"

permissions:
  contents: write

jobs:
  build-publish-release:
    name: Build, push, and update GitOps image tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Log output
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "joyboy67/log-output:${IMAGE_TAG}" ./log-output
          docker push "joyboy67/log-output:${IMAGE_TAG}"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tag in manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: log-output/manifests
        run: kustomize edit set image "joyboy67/log-output=joyboy67/log-output:${IMAGE_TAG}"

      - name: Commit updated manifest
        uses: EndBug/add-and-commit@v10
        with:
          add: log-output/manifests/kustomization.yaml
          message: "Release Log output ${{ github.sha }}"
          default_author: github_actions
